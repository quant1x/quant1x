[package]
name = "q1x"
version = "0.1.0"
edition = "2024"
authors = ["WangFeng <wangfengxy@sina.cn>"]
homepage = "https://www.q1x.rs/"
license = "MIT"
repository = "https://gitee.com/quant1x/q1x"

#[lib]
#name = "q1x"
#crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1.44", features = ["full"] }
tokio-cron-scheduler = { version = "0.13.0" }
chrono = "0.4.40"
csv = "1.3.1"
serde = { version = "1.0.218", features = ["derive"] }
serde_repr = "0.1.20"
hex = "0.4"
encoding = {version = "0.2.33"}
once_cell = {version = "1.21"}

# 进度条
indicatif = "0.17.11"
itertools = "0.14"
anyhow = "1.0.97"
dirs = "6.0"
serde_yaml = "0.9.33"
regex = "1.11"
thiserror = "2.0"
shellexpand = "3.1.0"
serde_json = "1.0"
hashbrown = "0.15"
rand = "0.9"
ctor = "0.4"
polars = { version = "0.39", features = ["lazy","csv","async","json","serde","rolling_window","simd","list_to_struct","array_to_struct","dtype-struct"] }
const_format = "0.2.34"
memmap2 = "0.9.5"
prost = "0.13" # Protobuf 编解码库
bytes = "1.10" # 处理字节缓冲
mio = { version = "1.0.3", features = ["net","os-poll"] }# 异步非阻塞网络事件驱动
signal-hook = { version = "0.3.17", features = ["default","iterator","channel"] }
ctrlc = { version = "3.4.5" }
log = "0.4.27"
log4rs = "1.3.0"

clap = { version = "4.5.32", features = ["derive"] }
lazy_static = "1.5.0"
uuid = { version = "1.16.0", features = ["v4"] }


[build-dependencies]
prost-build = "0.13.5"  # 生成 Rust 代码

[workspace]
members = ["engine", "py-q1x", "labs", "stock"]

#[profile.test]  # 自定义测试的编译配置
#opt-level = 2   # 启用 O2 优化
#debug = false   # 禁用调试符号

[profile.opt-dev]
inherits = "dev"
opt-level = 2

[profile.debug-release]
inherits = "release"
debug = true
incremental = true
codegen-units = 16
lto = "thin"

[profile.release]
#lto = "fat"        # 全量优化
lto = "thin"       # 链接时优化
codegen-units = 1  # 提升内联概率
panic = "abort"    # 减小二进制体积

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[[bench]]
name = "time"
harness = false
[[bench]]
name = "hashmap"
harness = false
