[package]
name = "quant1x"
version = "0.8.10"
edition = "2024"
authors = ["Quant1X Team"]
description = "Cross-language standard library for quantitative trading"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/quant1x/quant1x"
repository = "https://codeberg.org/quant1x/quant1x"
documentation = "https://codeberg.org/quant1x/quant1x"


# Cargo 只接受 include / exclude 之一。这里使用 include 白名单：
# 仅发布 Rust 源码、必需的说明文档与许可证，不打包 C/C++/Python/Go、
# 构建脚本、测试数据、图片等非 Rust 发布物。
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/main.rs",
    "quant1x/**/*.rs",
    "/tools/vyukov_perf.rs",
    "/tools/vyukov_runner.rs",
    "/benches/vyukov_bench.rs",
]

[lib]
name = "quant1x"
crate-type = ["cdylib", "rlib"]
path = "quant1x/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
mio = { version = "0.8", features = ["net", "os-poll"] }
hex = "0.4"
encoding_rs = "0.8"
encoding = "0.2"
flate2 = "1.0"
zip = "0.6"
once_cell = "1.18"
dirs = "4.0"
log = "0.4"
reqwest = { version = "0.11", features = ["blocking", "rustls-tls", "json"] }
filetime = "0.2"
httpdate = "1.0"
tempfile = "3"
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
log4rs = "1.3"
env_logger = "0.10"
csv = "1.2"
mimalloc = "0.1"
tokio = { version = "1.0", features = ["full"] }
cron = "0.12"
memmap2 = "0.9"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["shellapi", "processthreadsapi", "winbase", "handleapi", "minwinbase", "synchapi", "errhandlingapi", "winuser", "winnls", "stringapiset", "fileapi", "namedpipeapi", "winnt", "minwindef", "winerror"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
mockito = "1.0"
# Criterion for benchmarking
criterion = "0.5.1"
# keep dependencies minimal for now; remove tokio/cron/uuid/futures that were
# temporarily added during an attempt to integrate tokio-cron-scheduler.
bytes = "1.11"
signal-hook = "0.3"
ctrlc = "3.4"
tokio-cron-scheduler = "0.9"
serde_repr = "0.1.20"

# Criterion 自带 main (criterion_main!), 必须关闭 libtest harness:
# 否则 rustc 在 --test 模式注入的 main 会覆盖 criterion_main, 基准一次都不运行,
# 而编译与退出码均无异常 (表现为 `running 0 tests` 后 0.00s 通过).
[[bench]]
name = "vyukov_bench"
harness = false

[[bin]]
name = "q1x"
path = "main.rs"

[[bin]]
name = "vyukov_perf"
path = "tools/vyukov_perf.rs"

[[bin]]
name = "vyukov_runner"
path = "tools/vyukov_runner.rs"


[features]
# Feature gate to enable vyukov tests/impl
vyukov = []

