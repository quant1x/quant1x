[package]
name = "quant1x"
version = "0.6.3"
edition = "2021"
authors = ["Quant1X Team"]
description = "Cross-language standard library for quantitative trading"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/quant1x/quant1x"
repository = "https://gitee.com/quant1x/quant1x"
documentation = "https://gitee.com/quant1x/quant1x"


# Prefer an explicit include whitelist. This is more reliable than trying to
# exclude by extension because `cargo package` by default includes many
# repository files; a whitelist ensures only the crate-relevant files are
# packaged and uploaded to crates.io.
include = [
	"Cargo.toml",
	"README.md",
    "CHANGELOG.md",
	"LICENSE",
	"quant1x/**/*.rs",
	"quant1x/*.rs",
    "main.rs",
	"examples/*.rs",
	"examples/**/*.rs",
	"tests/*.rs",
    "tests/**/*.rs",
    "docs/**/*.md",
	"docs/README.md",
]

exclude = [
    "third_party/**/*",
]

[lib]
name = "quant1x"
crate-type = ["cdylib", "rlib"]
path = "quant1x/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
mio = { version = "0.8", features = ["net", "os-poll"] }
hex = "0.4"
encoding_rs = "0.8"
flate2 = "1.0"
once_cell = "1.18"
dirs = "4.0"
log = "0.4"
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"] }
filetime = "0.2"
httpdate = "1.0"
tempfile = "3"
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
log4rs = "1.3"
env_logger = "0.10"
csv = "1.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["shellapi", "processthreadsapi", "winbase", "handleapi", "minwinbase", "synchapi", "errhandlingapi", "winuser", "winnls", "stringapiset"] }
named_pipe = "0.4"
windows = { version = "0.48", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO"] }

[dev-dependencies]
mockito = "1.0"
# keep dependencies minimal for now; remove tokio/cron/uuid/futures that were
# temporarily added during an attempt to integrate tokio-cron-scheduler.

[[bin]]
name = "stock"
path = "main.rs"

