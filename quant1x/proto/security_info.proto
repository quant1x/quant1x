syntax = "proto3";

package quant1x.proto;

option go_package = "github.com/quant1x/quant1x/proto;proto";

import "google/protobuf/timestamp.proto";

// SecurityType mirrors the SecurityType enum used in source code.
enum SecurityType {
  SECURITY_TYPE_UNKNOWN = 0;
  SECURITY_TYPE_STOCK = 1;
  SECURITY_TYPE_ETF = 2;
  SECURITY_TYPE_FUND = 3;
  SECURITY_TYPE_BOND = 4;
  SECURITY_TYPE_BSTOCK = 5;
  SECURITY_TYPE_IPO = 6;
  SECURITY_TYPE_INDEX = 7;
  SECURITY_TYPE_BLOCK = 8;
  SECURITY_TYPE_OPTION = 9;
  SECURITY_TYPE_FUTURE = 10;
  SECURITY_TYPE_WARRANT = 11;
  SECURITY_TYPE_FOREX = 12;
  SECURITY_TYPE_COMMODITY = 13;
  // Keep OTHER aligned to 255 to match existing code where Other = 255.
  SECURITY_TYPE_OTHER = 255;
}

// Exchange stores market identifiers used by DetectSecurity and related APIs.
enum Exchange {
  // ExchangeIdShenZhen = 0
  EXCHANGE_SHENZHEN = 0;
  // ExchangeIdShangHai = 1
  EXCHANGE_SHANGHAI = 1;
  // ExchangeIdBeiJing = 2
  EXCHANGE_BEIJING = 2;
  // ExchangeIdHongKong = 21
  EXCHANGE_HONGKONG = 21;
  // ExchangeIdUSA = 22
  EXCHANGE_USA = 22;

  // Keep an explicit UNKNOWN/OTHER value aligned to 255 used in Go
  EXCHANGE_OTHER = 255;
}

// SecurityInfo is a compact, portable representation of a security's metadata.
message SecurityInfo {
  // Stable unique identifier for the record (optional, e.g. "SSE:600519").
  string id = 1;

  // Exchange-native code string (e.g. "600519", "000001", "00001").
  string code = 2;

  // Market / exchange this code belongs to.
  Exchange exchange = 3;

  // Security type, matches SecurityType enum above.
  SecurityType type = 4;

  // Short symbol/name usable in UIs or logs.
  string symbol = 5;

  // Full display name (primary locale).
  string name = 6;

  // Short description or category.
  string desc = 7;

  // Note / provenance field — used to store authoritative comments.
  string note = 8;

  // Additional known aliases for the security (tickers, codes, etc.).
  repeated string aliases = 9;

  // ISO currency code, if applicable (e.g. "CNY", "HKD", "USD").
  string currency = 10;

  // Listing date when available.
  google.protobuf.Timestamp listing_date = 11;

  // Delisting flag and delist date when known.
  bool delisted = 12;
  google.protobuf.Timestamp delist_date = 13;

  // Issuer name or short identifier.
  string issuer = 14;

  // Trading lot/board lot size (if applicable).
  uint32 lot_size = 15;

  // Number of decimals used for prices/quoting (if relevant).
  uint32 decimals = 16;

  // Optional standardized identifiers.
  string isin = 17;
  string cusip = 18;

  // Free-form key/value map for extra, implementation-specific fields.
  map<string, string> extra = 19;
}
