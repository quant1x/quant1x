[build-system]
requires = ["setuptools>=77.0.3", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "quant1x"
dynamic = ["version"]  # 仅保留 version 为动态（由 setuptools_scm 提供）
description = "Quant1X量化研究"
readme = {file = "README.md", content-type = "text/markdown"}
# PEP 639：SPDX 表达式 + 许可证文件白名单（默认 glob 会连 quant1x/ 下
# 第三方 vendored 代码的 LICENSE 一起收进 sdist，而那些代码本身并不发布）。
# 白名单内的文件会随 wheel 落到 dist-info/licenses/，供使用者查阅
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
# PEP 621 authors → core metadata: setuptools 将带 email 的条目映射到 Author-email，
# 仅含 name 的条目映射到 Author。同一作者分两条声明以同时填充 Author 与 Author-email。
# 分两条记录，是为了pip show时能够同时显示 Author 与 Author-email，如果只写一条带 email
# 的记录，pip show 只会显示 Author-email，而不会显示 Author。
authors = [
    { name = "Quant1X Team" },
    { name = "Quant1X Team", email = "wangfengxy@sina.cn" },
]
keywords = ["quant1x", "python"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.8"
dependencies = [
    "requests-toolbelt~=1.0.0",
    "loguru~=0.7.3",
    "icecream~=2.1.5",
    "PyYAML~=6.0.2",
    "numpy~=2.3.0",
    "pandas~=2.3.0",
    "numba~=0.62.1",
    "gitpython~=3.1.44",
    "python-dateutil~=2.9.0.post0",
    "matplotlib~=3.10.5",
    "akshare~=1.18.21",
    "mootdx~=0.11.7",
    "findpeaks~=2.7.4",
    "requests==2.32.0",
    "tqdm~=4.67.1",
    "xgboost~=3.0.0",
    "scikit-learn~=1.8.0",
    "scipy~=1.16.0",
    "caerus~=1.0.1",
    "joblib~=1.5.1",
    "inflection~=0.5.1",
    "apscheduler~=3.11.3",
    # quant1x/config/config.py 读取 .env
    "python-dotenv~=1.0",
    # quant1x/learn/fpgrowth/fp_growth_example.py 的 FP Growth 示例
    "mlxtend~=0.25",
]

[project.urls]
Homepage = "https://github.com/quant1x/quant1x"

[project.scripts]
# quant1x = "quant1x.__main__:entry"
# quant1x-qmt = "quant1x.trader.qmt:main"

[tool.setuptools.packages.find]
# 只收 quant1x 包本身；仓库里其它语言/测试/文档目录不在 include 范围内，无需 exclude
where = ["."]
include = ["quant1x", "quant1x.*"]

[tool.setuptools]
zip-safe = false
# setuptools_scm 会把 git 跟踪的所有文件当作包数据，这里显式关闭，
# wheel 只包含 packages.find 命中的 .py，不含字体/DLL/PYD 等非 Python 文件
include-package-data = false

[tool.setuptools_scm]
write_to = "quant1x/_version.py"
fallback_version = "0.0.0"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.ruff.lint.per-file-ignores]
# 指标模块是公式脚本的逐行移植: 中间序列按原步骤保留原名, 便于与公式对照;
# 其中不少步骤最终没有落到输出列上, 不希望 F841 逼着删掉算法的中间态。
"quant1x/indicators/*.py" = ["F841"]
